{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign up</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="{% url 'account_login' %}">Log in</a></p>
</div>
{% endblock %}
