{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <p class="auth-alt">Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
</div>
{% endblock %}
